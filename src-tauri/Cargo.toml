[package]
name = "suitecraft"
version = "0.1.0"
description = "A safe open-source AppImage suite launcher"
authors = ["SuiteCraft contributors"]
edition = "2021"

[lib]
name = "suitecraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["fs", "io-util", "process"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
dirs = "6"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
semver = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1

